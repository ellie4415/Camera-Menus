<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Nikon Camera Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700&display=swap">
<style>
/* Layout: the bay drawn as four glass shelves, each a row of tappable tags in shelf order. One font family, bold or regular only. */
:root {
  --bg: #F4F2EC; --surface: #FFFFFF; --ink: #1B1C2E; --muted: #5C5E73;
  --line: #D9D6CC; --glass: #A9C4C9; --brand: #2E3192; --on-brand: #FFFFFF;
  --mark: #FFD400; --on-mark: #1B1C2E; --shade: rgba(27,28,46,.55); --nikon: #F8E300;
  --font: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.35;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px }
.wrap { height: 100%; display: flex; flex-direction: column; gap: 10px }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center }
h1 { margin: 0 }
.nk { background: var(--nikon); padding: 10px 16px; line-height: 0 }
.nk img { height: 34px; width: auto; display: block }
.ac { height: 54px; width: auto }
.top .asof { margin-left: auto; font-size: 18px; font-weight: 700; color: var(--ink) }
.try { margin: 0; font-size: 16px; text-align: center }
.hl { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 16px }
.assoc { margin: 0; font-weight: 700; font-size: 16px }
.asof { color: var(--muted); margin: 0 }
.bayscroll { flex: 1 1 0; min-height: 0; overflow: auto; border-radius: 6px }
.bay { --k: 1; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 12px 18px 10px;
  border: 10px solid #FBFAF6; background: radial-gradient(120% 90% at 50% 40%, #FFFBEA 0%, #FBEFC6 55%, #EBD9A2 100%); box-shadow: inset 0 0 40px rgba(120,90,20,.25) }
.shelf { display: grid; grid-template-rows: calc(126px * var(--k)) 11px auto; column-gap: 8px }
.glass { grid-row: 2; grid-column: 1 / -1; margin: 0 -18px; background: linear-gradient(#DDF3EC, #9FCFC2 45%, #6FAE9F); box-shadow: 0 10px 14px -6px rgba(60,50,10,.45); border-top: 1px solid #F4FFFB }
.spot { grid-row: 1 / span 3; display: grid; grid-template-rows: subgrid; background: none; border: 0; padding: 0; min-width: 0; color: #1B1C2E; border-radius: 4px }
.spot:focus-visible { outline: 3px solid #2E3192; outline-offset: 3px }
.onstand { grid-row: 1; align-self: end; display: flex; flex-direction: column; align-items: center }
.onstand svg { display: block; max-width: 100% }
.onstand img { display: block; max-width: 100%; object-fit: contain; margin-bottom: -3px; filter: drop-shadow(0 3px 3px rgba(60,50,10,.35)) }
.stand { width: 92%; height: calc(22px * var(--k)); background: linear-gradient(#F7C71E, #E0A90A); clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%) }
.hang { grid-row: 3; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 3px 4px }
.tag { background: #FFFFFF; color: #1B1C2E; border: 1px solid #C9C6BA; border-top: 0; box-shadow: 0 2px 4px rgba(60,50,10,.25); width: 100%; padding: 5px 3px 6px; text-align: center; font-weight: 700; font-size: 14px; line-height: 1.12; overflow-wrap: anywhere }
.tag span { display: block; font-weight: 400; font-size: 11px; color: #5C5E73; padding-top: 2px }
.chip { background: #FFD400; color: #1B1C2E; font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 3px; white-space: nowrap }
.chip.rent { background: #2E3192; color: #FFFFFF }
.more { background: var(--brand); color: var(--on-brand); border: 0; border-radius: 6px; padding: 12px 18px; font-weight: 700; font-size: 16px }
.note { color: var(--muted); font-size: 13px; margin: 0 }

dialog { border: 0; border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog::backdrop { background: var(--shade) }
.card { padding: 24px; display: flex; flex-direction: column; gap: 14px }
.card h2 { font-size: 26px; font-weight: 700; margin: 0; text-wrap: balance }
.card h2 span { font-weight: 400 }
.rows { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-variant-numeric: tabular-nums; font-size: 17px }
.rows .now { font-weight: 700; font-size: 30px }
.rows .nowlabel { font-weight: 700; align-self: end; padding-bottom: 5px }
.cfgs { display: flex; flex-direction: column; gap: 8px }
.cfg { border: 1px solid var(--line); border-radius: 6px; background: var(--bg) }
.cfghead { width: 100%; background: none; border: 0; padding: 12px; display: flex; gap: 16px; justify-content: space-between; align-items: baseline; text-align: left; font-variant-numeric: tabular-nums }
.cfghead .c { font-weight: 700; font-size: 17px; min-width: 0; overflow-wrap: anywhere }
.cfghead .colors { display: block; font-weight: 400; font-size: 14px; color: var(--muted); padding-top: 2px }
.cfghead .n { font-weight: 700; font-size: 22px; white-space: nowrap }
button.cfghead[aria-expanded="true"] { border-bottom: 1px solid var(--line) }
.cfgdetail { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px }
div.cfghead + .cfgdetail { padding-top: 0 }
.cfgdetail p { margin: 0 }
.cfgdetail b { font-weight: 700 }
.card { overflow-y: auto; max-height: calc(100vh - 48px) }
.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
.opts { display: flex; flex-direction: column; gap: 8px }
.opts h3 { font-size: 16px; font-weight: 700; margin: 6px 0 0 }
.opt { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; text-align: left; display: flex; gap: 12px; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums }
.opt span:first-child { min-width: 0; overflow-wrap: anywhere }
.opt .p { white-space: nowrap; font-weight: 700 }
.close { align-self: flex-end; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 10px 18px; font-weight: 700 }
.list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto }

#idle { position: fixed; inset: 0; z-index: 20; background: var(--nikon); color: #000; border: 0; width: 100%;
  display: flex; flex-direction: column; gap: 22px; align-items: center; justify-content: center; text-align: center; padding: 20px 24px 70px }
#idle .idlelogo img { display: block; width: min(62vw, 95vh); height: auto }
#idle .idleac { line-height: 0 }
#idle .idleac img { display: block; height: min(26vh, 240px); width: auto }
#idle .tap { background: #000; color: var(--nikon); font-weight: 700; font-size: 22px; padding: 12px 24px; border-radius: 6px }
#idle .ticker { position: absolute; left: 0; right: 0; bottom: 0; background: #000; color: #FFF; overflow: hidden; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 17px; font-variant-numeric: tabular-nums }
#idle .run { display: inline-block; white-space: nowrap; animation: roll 150s linear infinite }
#idle .run b { font-weight: 700 }
@keyframes roll { to { transform: translateX(-50%) } }
@media (prefers-reduced-motion: reduce) { #idle .run { animation: none } }
</style>

<div class="wrap">
  <div class="top">
    <h1 class="nk"><img src="img/nikon.png" alt="Nikon"></h1>
    <button class="more" id="moreBtn" type="button">More Nikon Z lenses</button>
    <p class="asof" id="asof"></p>
    <img class="ac" src="img/actioncamera.png" alt="Action Camera">
  </div>
  <div class="bayscroll" id="bayBox"><div class="bay" id="bay" aria-label="Nikon display shelves, top to bottom"></div></div>
  <p class="try">Every camera here can be tried. Ask an associate and we will put it in your hands.</p>
</div>

<dialog id="itemDlg" aria-labelledby="itemTitle"><div class="card" id="itemCard"></div></dialog>
<dialog id="moreDlg" aria-labelledby="moreTitle"><div class="card">
  <h2 id="moreTitle">More Nikon Z lenses</h2>
  <p class="note">Not on display. Ask us to bring one out or order it in.</p>
  <div class="list" id="moreList"></div>
  <button class="close" type="button" data-close>Close</button>
</div></dialog>
<button id="idle" type="button" hidden aria-label="Tap for more info">
  <span class="idlelogo"><img src="img/nikon.png" alt="Nikon"></span>
  <span class="tap">Tap for more info</span>
  <span class="idleac"><img src="img/actioncamera-black.png" alt="Action Camera"></span>
  <span class="ticker"><span class="run" id="ticker"></span></span>
</button>

var HIGHLIGHTS = {"Z9":["Detects and tracks people, pets and birds","Keeps up with small, fast subjects","Focuses in near darkness"],"Z8":["Built for both photo and video","Very fast burst shooting","Pre-Release Capture saves the moment before you press the button"],"Z7II":["45.7 megapixel sensor","Wide dynamic range","Two card slots"],"Z6III":["Strong in low light","Pro-level video","Fast, reliable autofocus"],"Z5II":["Autofocus that recognizes your subject","Strong in low light","Bright viewfinder and built-in color presets"],"Z5II C":["Larger sensor for richer images","Simple, effortless handling"],"Zf":["Full-frame image quality","Strong in low light","Classic Nikon film-camera styling"],"Zfc":["Classic look with tactile dials","Modern Z series autofocus and image quality"],"Z50II":["Color presets at the press of a button","A clear step up from a phone","Small enough to carry everywhere"],"35mm f/1.7":["Close-up macro detail","Light and bright","Soft background blur"],"16-50mm f/2.8":["Bright f/2.8 through the whole zoom","Good in low light","Everyday zoom range"],"50-250mm":["Long reach for sports and wildlife","Image stabilization built in","Steady, precise autofocus"],"FTZ II":["Use Nikon DSLR lenses on Z cameras","Works with in-body stabilization","Weather sealed"],"26mm f/2.8":["The slimmest, lightest Z lens","Easy to carry everywhere","A natural fit for street photography"],"28mm f/2.8":["Small and light","Focuses close","Good in dim light"],"35mm f/1.4":["A walkaround lens for storytelling","Bright f/1.4 aperture","Smooth background blur"],"40mm f/2":["Small, light and easy to carry","Focuses close","Strong background separation"],"50mm f/2.8":["Life-size close-ups","Smooth background blur"],"50mm f/1.4":["Natural perspective","Smooth background blur","Works in any light"],"50mm f/1.8 S":["Exceptionally sharp","Fast, reliable autofocus"],"85mm f/1.8 S":["A classic portrait lens","Flattering perspective","Works with Eye-Detection AF"],"105mm f/2.8":["Life- var IR_START = new Date(2026, 10, 2), IR_END = new Date(2026, 10, 29, 23, 59, 59);

var ITEMS = [];
LENSES.forEach(function (r) {
  ITEMS.push({ shelf: r[0], pos: r[1], key: r[2], tag: r[3], full: r[4], rent: !!r[9],
    cfgs: [{ label: "", price: r[5], ir: r[6], irCam: r[7], camWith: r[8], opts: [{ color: "", rk: r[10], rn: r[11] }] }] });
});
CAMERAS.forEach(function (r) {
  ITEMS.push({ shelf: r[0], pos: r[1], key: r[2], tag: r[2], full: "Nikon " + r[2], rent: !!r[3], cam: true,
    cfgs: r[4].map(function (c) { return { label: c[0], price: c[1], ir: c[2], irCam: 0, camWith: "", opts: c[3].map(function (o) { return { color: o[0], rk: o[1], rn: o[2] }; }) }; }) });
});

function irLive() { var n = new Date(); return n >= IR_START && n <= IR_END; }
function money(n) { return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function whole(n) { return "$" + n.toLocaleString("en-US"); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function best(it) { var m = 0; if (irLive()) it.cfgs.forEach(function (c) { if (c.ir > m) m = c.ir; }); return m; }
function lowest(it) { var m = Infinity; it.cfgs.forEach(function (c) { var p = c.price - (irLive() ? c.ir : 0); if (p < m) m = p; }); return m; }

function stockLine(o) {
  if (o.rk == null) return "Ask us about availability.";
  if (o.rk > 0) return "In stock in Rocklin.";
  if (o.rn > 0) return "Out of stock in Rocklin. In stock at our Reno store, and we can usually have it here the next day.";
  return "Out of stock.";
}

function photo(it) {
  var h = Math.max(46, Math.min(116, Math.round((SIZE[it.key] || 50) * 1.12)));
  return '<img alt="" style="height:calc(' + h + 'px * var(--k))" src="' + PHOTOS[it.key] + '">';
}

function renderBay() {
  var bay = document.getElementById("bay");
  [1, 2, 3, 4].forEach(function (s) {
    var spots = ITEMS.filter(function (it) { return it.shelf === s; }).sort(function (a, b) { return a.pos - b.pos; });
    var row = el("div", "shelf"); row.style.gridTemplateColumns = "repeat(" + spots.length + ", minmax(0, 1fr))";
    row.appendChild(el("div", "glass"));
    spots.forEach(function (it, i) {
      var b = el("button", "spot"); b.type = "button"; b.style.gridColumn = String(i + 1);
      var on = el("span", "onstand"); on.innerHTML = photo(it); on.appendChild(el("span", "stand")); b.appendChild(on);
      var hang = el("span", "hang"); hang.appendChild(el("span", "tag", it.tag));
      if (best(it)) hang.appendChild(el("span", "chip", (it.cfgs.length > 1 ? "Save up to " : "Save ") + whole(best(it))));
      if (it.rent) hang.appendChild(el("span", "chip rent", "Rental"));
      b.appendChild(hang);
      b.setAttribute("aria-label", it.full);
      b.addEventListener("click", function () { openItem(it); });
      row.appendChild(b);
    });
    bay.appendChild(row);
  });
}

function detail(c) {
  var d = el("div", "cfgdetail"), live = irLive(), s = live ? c.ir : 0;
  if (s) d.appendChild(el("p", null, "Regular price " + money(c.price) + ", instant savings " + whole(s) + "."));
  if (c.irCam && live) d.appendChild(el("p", null, "Buy it with " + c.camWith + " and the instant savings are " + whole(c.irCam) + ", for " + money(c.price - c.irCam) + "."));
  c.opts.forEach(function (o) {
    var p = el("p");
    if (o.color) { p.appendChild(el("b", null, o.color + ": ")); }
    p.appendChild(document.createTextNode(stockLine(o)));
    d.appendChild(p);
  });
  return d;
}

function openItem(it) {
  var card = document.getElementById("itemCard"); card.textContent = "";
  var h = el("h2", null, it.full); h.id = "itemTitle"; card.appendChild(h);
  var hl = HIGHLIGHTS[it.key];
  if (hl) { var u = el("ul", "hl"); hl.forEach(function (t) { u.appendChild(el("li", null, t)); }); card.appendChild(u); }
  var live = irLive(), list = el("div", "cfgs"), single = it.cfgs.length === 1;
  it.cfgs.forEach(function (c, i) {
    var s = live ? c.ir : 0, colors = c.opts.filter(function (o) { return o.color; }).map(function (o) { return o.color; }).join(", ");
    var wrap = el("div", "cfg"), head = el(single ? "div" : "button", "cfghead");
    var left = el("span", "c");
    left.appendChild(document.createTextNode(c.label || (s ? "Price today" : "Price")));
    if (colors) left.appendChild(el("span", "colors", colors));
    head.appendChild(left); head.appendChild(el("span", "n", money(c.price - s)));
    wrap.appendChild(head);
    var d = detail(c); wrap.appendChild(d);
    if (!single) {
      head.type = "button"; d.hidden = i !== 0; head.setAttribute("aria-expanded", String(i === 0));
      head.addEventListener("click", function () {
        list.querySelectorAll(".cfgdetail").forEach(function (x) { x.hidden = true; });
        list.querySelectorAll(".cfghead").forEach(function (x) { x.setAttribute("aria-expanded", "false"); });
        d.hidden = false; head.setAttribute("aria-expanded", "true");

  if (!single) card.appendChild(el("p", "note", "Tap an option to see if it is in stock."));
  var facts = el("ul", "facts");

  if (it.rent) facts.appendChild(el("li", null, "Available to rent. Ask us for rates and dates."));
  if (facts.children.length) card.appendChild(facts);
  card.appendChild(el("p", "assoc", it.cam ? "Want to try it? Ask an associate and we will put it in your hands." : "Questions, or want to try it on a camera? Ask an associate."));
  var c = el("button", "close", "Close"); c.type = "button"; c.addEventListener("click", function () { document.getElementById("itemDlg").close(); }); card.appendChild(c);
  var more = document.getElementById("moreDlg"); if (more.open) more.close();
  var dlg = document.getElementById("itemDlg"); if (!dlg.open) dlg.showModal();
}

function renderMore() {
  var list = document.getElementById("moreList");
  ITEMS.filter(function (it) { return it.shelf === "N"; }).forEach(function (it) {
    var b = el("button", "opt"); b.type = "button";
    b.appendChild(el("span", null, it.full)); b.appendChild(el("span", "p", money(lowest(it))));
    b.addEventListener("click", function () { openItem(it); });
    list.appendChild(b);
  });
}

// Idle screen: after 90 seconds without a touch, show the Nikon screen with a rolling strip of items and prices.
var IDLE_MS = 90000, idleTimer = null;
(function () {
  var run = document.getElementById("ticker");
  for (var k = 0; k < 2; k++) ITEMS.filter(function (it) { return it.shelf !== "N"; }).forEach(function (it) {
    run.appendChild(el("b", null, it.full.replace("NIKKOR ", "")));
    run.appendChild(document.createTextNode(" " + (it.cfgs.length > 1 ? "from " : "") + money(lowest(it)) + "\u2003\u2003"));
  });
})();
function goIdle() {
  ["itemDlg", "moreDlg"].forEach(function (id) { var d = document.getElementById(id); if (d.open) d.close(); });
  document.getElementById("idle").hidden = false;
}
function wake() {
  document.getElementById("idle").hidden = true;
  clearTimeout(idleTimer); idleTimer = setTimeout(goIdle, IDLE_MS);
}

document.getElementById("asof").textContent = "Tap for more info";
document.getElementById("moreBtn").addEventListener("click", function () { document.getElementById("moreDlg").showModal(); });
document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", function () { b.closest("dialog").close(); }); });
document.querySelectorAll("dialog").forEach(function (d) { d.addEventListener("click", function (e) { if (e.target === d) d.close(); }); });
document.getElementById("idle").addEventListener("click", wake);
["pointerdown", "keydown", "scroll"].forEach(function (ev) { document.addEventListener(ev, function () { if (document.getElementById("idle").hidden) wake(); }, true); });
renderBay(); renderMore(); wake();

// Fit all four shelves on one screen: tag text keeps its size, photos and stands shrink or grow to use the height.
function fit() {
  var box = document.getElementById("bayBox"), bay = document.getElementById("bay"), ah = box.clientHeight;
  if (!ah) return;
  bay.style.minHeight = "0";
  bay.style.setProperty("--k", "1"); var h1 = bay.offsetHeight;
  bay.style.setProperty("--k", "0.5"); var h2 = bay.offsetHeight;
  var per = (h1 - h2) / 0.5, fixed = h1 - per, k = per > 0 ? (ah - fixed) / per : 1;
  bay.style.setProperty("--k", String(Math.max(0.4, Math.min(1.5, k))));
  bay.style.minHeight = "";
}
fit(); window.addEventListener("resize", fit); window.addEventListener("load", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
